name: geomaphistory

# Démarrage à partir des images exportées (aucune source ni build nécessaire).
# Le dossier ./data, à côté de ce fichier, contient tout le contenu édité :
#   data/.env       compte administrateur (créé au premier démarrage s'il manque, voir les logs de l'api)
#   data/map/       éléments de la carte (GeoJSON)
#   data/wiki/      pages du wiki (Markdown) et leur historique
#   data/uploads/   images

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: geomap
      POSTGRES_USER: geomap
      # Base interne (jamais exposée hors du réseau Docker) et reconstructible : pas un secret.
      POSTGRES_PASSWORD: geomap
    volumes:
      - pgcache:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geomap -d geomap"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    image: geomaphistory-api:__VERSION__
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://geomap:geomap@db:5432/geomap
      DATA_DIR: /data
      # Facultatif : prioritaire sur data/.env (ex. ADMIN_PASSWORD=… docker compose up -d).
      # Sans valeur nulle part, un compte est généré, écrit dans data/.env et affiché dans les logs.
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - ./data:/data

  web:
    image: geomaphistory-web:__VERSION__
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  pgcache:
